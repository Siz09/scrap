name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web
      - name: Committed frontend build is up to date
        run: git diff --exit-code -- devicescout/web/dist || (echo "Run 'npm run build' in web/ and commit devicescout/web/dist" && exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

name: Docker image

# Continuous delivery: every push to main publishes ghcr.io/<owner>/<repo>:latest (and :sha-xxxx);
# a tag like v0.4.0 also publishes :0.4.0 and :0.4. Pull requests only build, to catch breakage.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (and push outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 too, so it runs on cheap ARM servers and Raspberry Pi.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker build -t smoke .
          docker run -d --name smoke -p 8765:8765 smoke devicescout serve --host 0.0.0.0 --no-browser --read-only --sample
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -fs "http://127.0.0.1:8765/api/deals" | grep -q '"total"'
          curl -fs http://127.0.0.1:8765/ | grep -q "<title>DeviceScout</title>"
          docker logs smoke

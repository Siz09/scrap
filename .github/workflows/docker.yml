name: Docker images

# Continuous delivery for the website and the scraper:
#   ghcr.io/<owner>/<repo>           website  (Dockerfile target "web")
#   ghcr.io/<owner>/<repo>-scraper   scraper  (target "scraper": all browser scrapers installed)
# Every push to main publishes :latest and :sha-xxxx; a tag like v0.5.0 also publishes :0.5.0 and :0.5.
# Pull requests build and test but don't publish. Nothing is published unless the tests pass.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: docker compose build
        env:
          DEVICESCOUT_IMAGE: local/devicescout
          DEVICESCOUT_TAG: ci

      - name: Every scraper in the scraper image can fetch a real page
        run: |
          docker run --rm --shm-size 1g local/devicescout-scraper:ci \
            devicescout scrapers --test https://example.com \
              --require scrapling-http,urllib,scrapling-dynamic,scrapling-stealth,crawl4ai

      - name: Start the stack
        run: docker compose up -d
        env:
          DEVICESCOUT_IMAGE: local/devicescout
          DEVICESCOUT_TAG: ci
          DEVICESCOUT_ADMIN_KEY: ci-admin-key
          SCRAPE_EVERY: 7d

      - name: Website works; admin key gates jobs; the scraper container runs queued jobs
        run: |
          set -e
          B=http://127.0.0.1:8765
          for i in $(seq 1 60); do curl -fs $B/api/health && break; sleep 2; done
          curl -fs $B/ | grep -q "<title>DeviceScout</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/jobs -H 'Content-Type: application/json' -d '{"kind":"check"}')" = 401
          # A job naming no real source: tests the queue without contacting any store.
          ID=$(curl -fs -X POST $B/api/jobs -H 'Content-Type: application/json' -H 'X-Admin-Key: ci-admin-key' \
                 -d '{"kind":"check","names":["ci-no-such-source"]}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 90); do
            S=$(curl -fs $B/api/jobs/$ID | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$S" = done ] && break; sleep 2
          done
          test "$S" = done
          curl -fs $B/api/sources | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          ready = {s["name"] for s in d["scrapers"] if s["available"]}
          print("scraper container reports:", sorted(ready))
          assert {"scrapling-dynamic", "scrapling-stealth", "crawl4ai"} <= ready, ready'

      - name: Logs
        if: always()
        run: docker compose logs --tail 80
        env:
          DEVICESCOUT_IMAGE: local/devicescout
          DEVICESCOUT_TAG: ci

  publish:
    needs: test-stack
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: web
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - target: scraper
            suffix: "-scraper"
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

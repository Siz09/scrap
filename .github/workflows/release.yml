name: Release

# Builds the one-file desktop app for Windows, macOS and Linux, plus the pip wheel.
# Push a tag like v0.2.0 to publish a GitHub release; run manually to just get artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: DeviceScout-windows-x64.exe
            built: dist/DeviceScout.exe
          - os: macos-latest
            asset: DeviceScout-macos-arm64
            built: dist/DeviceScout
          - os: ubuntu-latest
            asset: DeviceScout-linux-x64
            built: dist/DeviceScout
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pyinstaller --noconfirm packaging/devicescout.spec
      - name: Smoke test the executable
        shell: bash
        run: |
          export DEVICESCOUT_HOME="$RUNNER_TEMP/dshome"
          ./${{ matrix.built }} sources
          ./${{ matrix.built }} advise --category phone --budget 60k
      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devicescout"
version = "0.1.0"
description = "Multi-source electronics scraper (Scrapling) that normalizes specs and ranks devices by buyer preference."
requires-python = ">=3.10"
dependencies = ["scrapling[fetchers]>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devicescout = "devicescout.cli:main"

[tool.setuptools.packages.find]
include = ["devicescout*"]

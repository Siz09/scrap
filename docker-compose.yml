# DeviceScout website + scraper.
#
#   DEVICESCOUT_ADMIN_KEY=<long random string> docker compose up -d
#                                               # site on http://localhost:8765, scraper every 6 h
#   DOMAIN=devicescout.example.com docker compose --profile https up -d   # adds automatic HTTPS
#
# Both services share the `data` volume (SQLite database, sources.json, caches).
# Edit the source list with:  docker compose exec scraper sh -c 'vi $DEVICESCOUT_HOME/sources.json'
# or mount your own:          ./sources.json:/data/sources.json

x-app: &app
  restart: unless-stopped
  volumes:
    - data:/data
  environment: &env
    TZ: ${TZ:-Asia/Kathmandu}
    DEVICESCOUT_RATES: ${DEVICESCOUT_RATES:-}
    # Optional. Empty (fine on your own machine): anyone who opens the site can run checks/updates.
    # Set a long random value before putting the site on the internet; you type it on Data sources.
    DEVICESCOUT_ADMIN_KEY: ${DEVICESCOUT_ADMIN_KEY:-}

services:
  web:
    <<: *app
    image: ${DEVICESCOUT_IMAGE:-ghcr.io/siz09/scrap}:${DEVICESCOUT_TAG:-latest}
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8765}:8765"

  scraper:
    <<: *app
    image: ${DEVICESCOUT_IMAGE:-ghcr.io/siz09/scrap}-scraper:${DEVICESCOUT_TAG:-latest}
    build:
      context: .
      target: scraper
    command: ["devicescout", "schedule", "--every", "${SCRAPE_EVERY:-6h}", "--check-first"]
    environment:
      <<: *env
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}   # optional, paid: enables the last-resort scraper
    shm_size: 1gb     # Chromium needs more shared memory than Docker's 64 MB default
    depends_on:
      - web

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}   # your site's domain; its DNS must point at this server
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  data:
  caddy_data:
  caddy_config:

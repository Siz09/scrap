# DeviceScout on your own machine: website + scraper + PostgreSQL.
#
#   docker compose up -d --build        # site on http://localhost:8765, scraper every 6 h
#
# Data lives in PostgreSQL (the `db` service, volume `pgdata`), in three layers:
#   raw.*       every page fetched and every record parsed, one partition per website
#   clean.*     the merged, cleaned catalogue (products, every price seen, quality log)
#   category.*  one view per device type with typed columns (category.phone, category.laptop ...)
# Look at it with any PostgreSQL client (DBeaver, pgAdmin, psql) on localhost:${DB_PORT:-55432},
# user/database devicescout, password $POSTGRES_PASSWORD (default: devicescout).
# The `data` volume keeps sources.json and caches.
#
# Everything listens on 127.0.0.1 only: reachable from this computer, not from the network.

x-app: &app
  restart: unless-stopped
  volumes:
    - data:/data
  environment: &env
    TZ: ${TZ:-Asia/Kathmandu}
    DEVICESCOUT_RATES: ${DEVICESCOUT_RATES:-}
    DEVICESCOUT_DB: postgresql://devicescout:${POSTGRES_PASSWORD:-devicescout}@db:5432/devicescout
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    image: devicescout-web
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8765}:8765"

  scraper:
    <<: *app
    image: devicescout-scraper
    build:
      context: .
      target: scraper
    command: ["devicescout", "schedule", "--every", "${SCRAPE_EVERY:-6h}", "--check-first"]
    environment:
      <<: *env
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}   # optional, paid: enables the last-resort scraper
    shm_size: 1gb     # Chromium needs more shared memory than Docker's 64 MB default

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: devicescout
      POSTGRES_USER: devicescout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devicescout}
      TZ: ${TZ:-Asia/Kathmandu}
    # pg_stat_statements: query timings; lz4: faster, smaller compression for stored pages
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "default_toast_compression=lz4"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicescout -d devicescout"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  data:
  pgdata:
